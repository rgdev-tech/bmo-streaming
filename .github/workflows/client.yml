name: Client — EAS Build

on:
  push:
    branches: [main, staging, develop]
    paths:
      - 'apps/client/**'
      - '.github/workflows/client.yml'
  pull_request:
    branches: [main, staging, develop]
    paths:
      - 'apps/client/**'

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

  build-preview:
    name: EAS Build — Preview (iOS + Android)
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Pull env vars from Doppler (stg)
        run: |
          curl -Ls --retry 3 --retry-delay 3 \
            https://cli.doppler.com/install.sh | sh
          doppler secrets download --no-file --format env \
            --token=${{ secrets.DOPPLER_TOKEN_STG }} \
            --project bmo-streaming --config stg \
            >> $GITHUB_ENV

      - name: Build (preview)
        run: eas build --platform all --profile preview --non-interactive

  build-production:
    name: EAS Build — Production (iOS + Android)
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Pull env vars from Doppler (prd)
        run: |
          curl -Ls --retry 3 --retry-delay 3 \
            https://cli.doppler.com/install.sh | sh
          doppler secrets download --no-file --format env \
            --token=${{ secrets.DOPPLER_TOKEN_PRD }} \
            --project bmo-streaming --config prd \
            >> $GITHUB_ENV

      - name: Build (production)
        run: eas build --platform all --profile production --non-interactive

      - name: Submit to stores
        run: eas submit --platform all --latest --non-interactive
        continue-on-error: true
